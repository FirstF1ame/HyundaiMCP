[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-mcp-poc"
version = "0.1.0"
description = "Local read-only Vehicle MCP proof of concept"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0", "fastapi==0.162.0", "uvicorn==0.54.0",
  "httpx==0.28.1", "python-dotenv==1.2.4",
]

[project.optional-dependencies]
gpt = ["openai>=2,<3"]
test = ["pytest==8.4.2", "pytest-asyncio==0.26.0"]

[tool.setuptools.packages.find]
include = ["vehicle_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
